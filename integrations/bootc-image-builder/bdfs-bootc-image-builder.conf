# bdfs-bootc-image-builder.conf — default configuration for the bootc-image-builder integration
#
# Copy to /etc/bdfs/bootc-image-builder.conf or ~/.config/bdfs/bootc-image-builder.conf
# and adjust. All values can be overridden per-invocation with CLI flags or env vars.

# bootc-image-builder container image to use.
# Pin to a specific digest for reproducible builds.
# Default: quay.io/centos-bootc/bootc-image-builder:latest
BDFS_BIB_IMAGE=quay.io/centos-bootc/bootc-image-builder:latest

# Default output directory for built disk images.
# Each build writes into a subdirectory named after the image type.
BDFS_BIB_OUTPUT=./output

# Default path to config.toml for user/SSH key injection.
# Leave blank to build without a config file (no default user injected).
# See: https://github.com/osbuild/bootc-image-builder#-build-config
BDFS_BIB_CONFIG=

# Set to "true" to use rootless/KVM mode (experimental).
# Rootless mode does not require root but needs KVM access.
# Requires: /dev/kvm accessible to the current user.
BDFS_BIB_ROOTLESS=false

# Default bootc OCI image reference.
# Shared with bdfs-bootc — set once, used by both integrations.
# Example: quay.io/myorg/myos:stable
BDFS_BOOTC_IMAGE=
