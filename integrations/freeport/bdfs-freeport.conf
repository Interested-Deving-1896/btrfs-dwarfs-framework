# bdfs-freeport.conf — Freeport integration configuration
#
# Copy to /etc/bdfs/freeport.conf or ~/.config/bdfs/freeport.conf
# Environment variables override these values.

# Freeport git repository URL.
BDFS_FREEPORT_REPO=https://github.com/ryandward/freeport.git

# Local clone path. Patches are fetched here and reused across invocations.
BDFS_FREEPORT_DIR=~/.cache/bdfs/freeport

# Target distro family for patch selection.
# auto  — detected from the target root's /etc/os-release (recommended)
# arch  — Arch Linux and derivatives
# debian — Debian, Devuan, Kali, and derivatives
# ubuntu — Ubuntu and derivatives
# fedora — Fedora, RHEL, CentOS Stream, AlmaLinux, Rocky
# opensuse — openSUSE Leap/Tumbleweed (falls back to fedora/rpm patches)
# alpine — Alpine Linux
# void   — Void Linux
# gentoo — Gentoo Linux
BDFS_FREEPORT_DISTRO=auto

# Default workspace name for apply/export/status operations.
BDFS_FREEPORT_WORKSPACE=freeport-$(date +%Y%m%d)
