# bdfs-fwupd.conf — site configuration for the fwupd bdfs integration
#
# Copy to /etc/bdfs/fwupd.conf and adjust for your environment.
# All values shown are defaults.

# Prefix used when auto-naming pre-update snapshots.
# Snapshots will be named: {prefix}-pre-update-{timestamp}
BDFS_FWUPD_SNAPSHOT_PREFIX=fwupd

# Directory where DwarFS firmware state archives are written by
# 'bdfs-fwupd export' and 'bdfs-fwupd audit'.
BDFS_FWUPD_EXPORT_DIR=/var/lib/bdfs/fwupd

# Number of pre-update snapshots to retain. Older snapshots are pruned
# automatically after each successful 'bdfs-fwupd update'.
# Set to 0 to disable pruning.
BDFS_FWUPD_KEEP_SNAPSHOTS=3

# Compression algorithm for DwarFS firmware archives.
# Options: zstd (best ratio), lz4 (fastest), none
BDFS_FWUPD_COMPRESSION=zstd

# Path to fwupdmgr binary. Override if installed in a non-standard location.
FWUPD_CMD=fwupdmgr

# Path to bdfs binary.
BDFS_CMD=bdfs

# Path to mkdwarfs binary (required for export/audit commands).
DWARFS_CMD=mkdwarfs
