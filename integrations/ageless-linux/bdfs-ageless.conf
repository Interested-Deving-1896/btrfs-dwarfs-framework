# bdfs-ageless.conf — Ageless Linux integration configuration
#
# Copy to /etc/bdfs/ageless.conf or ~/.config/bdfs/ageless.conf
# Environment variables override these values.

# URL or local path to the become-ageless.sh conversion script.
# The script is fetched fresh on each convert invocation unless a local
# path is specified.
BDFS_AGELESS_SCRIPT=https://agelesslinux.org/become-ageless.sh

# Conversion mode passed to become-ageless.sh:
#   standard  — --accept: applies all patches, installs stub API, updates os-release
#   flagrant  — --flagrant: standard + installs REFUSAL file and noncompliance docs
#   minimal   — --minimal: patches systemd birthDate only, no os-release changes
BDFS_AGELESS_MODE=standard

# Default workspace name for convert/export/distribute operations.
# Supports strftime-style date substitution via $(date +...).
BDFS_AGELESS_WORKSPACE=ageless-$(date +%Y%m%d)

# bootc-image-builder tool image used by the distribute subcommand.
# Despite the "centos-bootc" namespace, this is a distro-neutral tool.
BDFS_BIB_IMAGE=quay.io/centos-bootc/bootc-image-builder:latest
