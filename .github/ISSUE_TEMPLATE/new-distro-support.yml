name: New integration request
description: Request support for a new filesystem, container, or OS integration
labels: ["enhancement", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to request a new integration with btrfs-dwarfs-framework
        (e.g. a new container runtime, OS image format, or filesystem tool).

  - type: input
    id: integration-name
    attributes:
      label: Integration name
      placeholder: "e.g. systemd-sysext, casync, erofs"
    validations:
      required: true

  - type: input
    id: upstream-url
    attributes:
      label: Upstream project URL
      placeholder: "https://github.com/..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would this integration work with btrfs/dwarfs?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Any relevant configuration, dependencies, or prior art

  - type: checkboxes
    id: willing-to-implement
    attributes:
      label: Contribution
      options:
        - label: I am willing to write the integration scripts and submit a PR
