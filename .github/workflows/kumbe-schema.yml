name: KUMBE manifest schema

on:
  pull_request:
    paths:
      - "schemas/kernel-upstream-migration/**"
      - "tests/kernel-migration/**"
      - ".github/workflows/kumbe-schema.yml"
  push:
    branches: [main]
    paths:
      - "schemas/kernel-upstream-migration/**"
      - "tests/kernel-migration/**"
      - ".github/workflows/kumbe-schema.yml"

permissions:
  contents: read

jobs:
  schema:
    name: Validate KUMBE manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate schema and safety fixtures
        run: python tests/kernel-migration/test_manifest_schema.py
      - name: Test read-only dependency planner
        run: python -m unittest discover -s tests/kernel-migration -p "test_kumbe_plan.py" -v
      - name: Smoke-test planner against audit fixture
        run: python scripts/kumbe_plan.py tests/kernel-migration/fixtures/valid-audit-only.json > /dev/null
