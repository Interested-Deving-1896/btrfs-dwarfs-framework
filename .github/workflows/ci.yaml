name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: find . -name '*.sh' -exec shellcheck -x -S warning --exclude=SC1083 {} +

  test:
    name: C Userspace Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential

      - name: Configure unit-test build
        run: cmake -S userspace -B build/unit-tests -DBUILD_TESTS=ON -DBUILD_DAEMON=OFF -DBUILD_CLI=OFF

      - name: Build unit tests
        run: cmake --build build/unit-tests --parallel

      - name: Run unit tests
        run: ctest --test-dir build/unit-tests --output-on-failure
