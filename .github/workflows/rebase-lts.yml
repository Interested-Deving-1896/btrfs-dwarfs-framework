name: Rebuild LTS Branch (penguins-eggs)

on:
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to rebase onto (upstream default)"
        required: false
        default: "master"
      feature_branch:
        description: "Branch whose commits to rebase"
        required: false
        default: "all-features"
      lts_branch:
        description: "Branch to force-push the result to"
        required: false
        default: "lts"

permissions:
  contents: read

jobs:
  rebase-lts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Manual-only and explicitly gated; keep disabled until the rebase implementation is audited.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.BDFS_SOURCE_AUDITS_COMPLETE == 'true' && vars.BDFS_LTS_REBASE_ENABLED == 'true' }}

    steps:
      - name: Checkout fork-sync-all
        uses: actions/checkout@v6

      - name: Rebuild lts on Interested-Deving-1896/penguins-eggs
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: Interested-Deving-1896/penguins-eggs
          BASE_BRANCH: ${{ inputs.base_branch || 'master' }}
          FEATURE_BRANCH: ${{ inputs.feature_branch || 'all-features' }}
          LTS_BRANCH: ${{ inputs.lts_branch || 'lts' }}
        run: bash scripts/rebase-lts.sh
      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
