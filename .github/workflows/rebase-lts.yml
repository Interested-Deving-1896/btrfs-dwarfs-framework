name: Rebuild LTS Branch (penguins-eggs)

on:
  # Run after the Interested-Deving-1896 sync so master is already up to date
  workflow_run:
    workflows: ["Sync Interested-Deving-1896 Forks"]
    types: [completed]
  # Also allow manual trigger; release gates below still apply.
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to rebase onto (upstream default)"
        required: false
        default: "master"
      feature_branch:
        description: "Branch whose commits to rebase"
        required: false
        default: "all-features"
      lts_branch:
        description: "Branch to publish the result to"
        required: false
        default: "lts"

permissions:
  contents: read

jobs:
  rebase-lts:
    # This is a destructive cross-repository operation. Neither manual dispatch
    # nor a successful sync bypasses the two explicit repository-variable gates.
    if: ${{ vars.BDFS_SOURCE_AUDIT_COMPLETE == 'true' && vars.BDFS_LTS_REBASE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fork-sync-all
        uses: actions/checkout@v6

      - name: Rebuild lts on Interested-Deving-1896/penguins-eggs
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: Interested-Deving-1896/penguins-eggs
          BASE_BRANCH: ${{ inputs.base_branch || 'master' }}
          FEATURE_BRANCH: ${{ inputs.feature_branch || 'all-features' }}
          LTS_BRANCH: ${{ inputs.lts_branch || 'lts' }}
          BDFS_SOURCE_AUDIT_COMPLETE: ${{ vars.BDFS_SOURCE_AUDIT_COMPLETE }}
          BDFS_LTS_REBASE_ENABLED: ${{ vars.BDFS_LTS_REBASE_ENABLED }}
        run: bash scripts/rebase-lts.sh
      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
