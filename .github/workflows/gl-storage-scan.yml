name: GitLab Storage Scan
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
      GL_API: https://gitlab.com/api/v4
      GROUP_PATH: openos-project
    steps:
      - name: Scan all projects storage (all pages)
        run: |
          set -euo pipefail

          PAGE=1
          ALL_PROJECTS="[]"
          while true; do
            BATCH=$(curl -sf -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "${GL_API}/groups/${GROUP_PATH}/projects?include_subgroups=true&per_page=100&page=${PAGE}&statistics=true&with_statistics=true")
            COUNT=$(echo "${BATCH}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
            echo "Page ${PAGE}: ${COUNT} projects"
            if [ "${COUNT}" -eq 0 ]; then break; fi
            ALL_PROJECTS=$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1]) + json.load(sys.stdin)))' "${ALL_PROJECTS}" <<< "${BATCH}")
            PAGE=$((PAGE + 1))
            if [ "${PAGE}" -gt 20 ]; then
              echo "::warning::Stopped at the 20-page safety cap"
              break
            fi
          done

          ALL_PROJECTS_JSON="${ALL_PROJECTS}" python3 - <<'PY'
          import json
          import os

          projects = json.loads(os.environ["ALL_PROJECTS_JSON"])
          print(f"Total projects found: {len(projects)}")
          print()

          def repo_size(project):
              return project.get("statistics", {}).get("repository_size", 0)

          def fmt(value):
              if value >= 1073741824:
                  return f"{value / 1073741824:.1f}G"
              if value >= 1048576:
                  return f"{value / 1048576:.1f}M"
              if value >= 1024:
                  return f"{value / 1024:.1f}K"
              return f"{value}B"

          print("{:<70} {:>10} {:>10} {:>10} {:>10}".format(
              "Project", "Repo", "LFS", "Artifacts", "Total"
          ))
          print("-" * 115)

          total_repo = total_lfs = total_art = total_all = 0
          for project in sorted(projects, key=repo_size, reverse=True):
              stats = project.get("statistics", {})
              repo = stats.get("repository_size", 0)
              lfs = stats.get("lfs_objects_size", 0)
              artifacts = stats.get("job_artifacts_size", 0)
              total = stats.get("storage_size", 0)
              if total == 0:
                  continue
              name = project.get("path_with_namespace", project.get("name", "?"))
              if len(name) > 68:
                  name = name[:65] + "..."
              print("{:<70} {:>10} {:>10} {:>10} {:>10}".format(
                  name, fmt(repo), fmt(lfs), fmt(artifacts), fmt(total)
              ))
              total_repo += repo
              total_lfs += lfs
              total_art += artifacts
              total_all += total

          print("-" * 115)
          print("{:<70} {:>10} {:>10} {:>10} {:>10}".format(
              "TOTAL", fmt(total_repo), fmt(total_lfs), fmt(total_art), fmt(total_all)
          ))
          PY
